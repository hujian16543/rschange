# ============================================================
# 遥感变化检测平台 · uv 工作区根配置
#
# 职责边界：
#   - 本文件 = 工作区根：声明 Python 版本约束、dev 依赖组、全部工具配置
#   - backend/pyproject.toml = 成员包 rschange：只声明运行依赖
#   - uv.lock = 唯一锁文件，覆盖全部成员，必须入库
# ============================================================

[project]
name = "remote-sensing"
# 工作区根的版本，与产品版本同号（真相源为 backend/pyproject.toml）。
# 本体不打包，此值仅用于消除版本号漂移，由 scripts/verify_version.py 守护。
version = "0.5.0"
description = "遥感变化检测平台 · 工作区根（本体不打包，仅作工具链入口）"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
    # §7.3「多边形可被 GEOS 解析且不自交」的独立判定依据。
    # 与 numpy/scipy 同属验证工具，不入 rschange 的运行依赖。
    "shapely>=2.0",
    # scipy 至今不带 py.typed（实测 1.18.1：site-packages/scipy 下无 py.typed），
    # 而 mypy strict 会把 `import scipy.ndimage` 判为 import-untyped。
    #
    # 不用 `[[tool.mypy.overrides]] ignore_missing_imports` 掩盖：那会让
    # `scipy.*` 的全部调用退化成 Any，此后 scipy 相关的类型错误再也测不出来，
    # 正是 strict 模式要防的情形。scipy-stubs 提供真实签名，代价是版本与
    # scipy 严格绑定（stubs 1.18.1.1 要求 scipy==1.18.1）——升级 scipy 时须
    # 同步升 stubs，否则 `uv lock` 直接失败。该约束可接受：失败是显式的，
    # 而 Any 造成的类型黑洞是隐式的。
    "scipy-stubs>=1.18.1.1",
    # scripts/verify_containers.py 解析 docker-compose.yml 用。显式声明而非
    # 依赖传递引入：传递依赖一旦被上游移除，门禁脚本会以 ImportError 的形式
    # 突然失效，且排查方向会被引向 compose 文件而不是依赖树。
    "pyyaml>=6.0",
]

[tool.uv]
# 本工作区根自身不是待安装的包，只承载 workspace 与工具配置
package = false

# 禁止 uv 下载自管解释器。
# 若允许下载，uv 会用新下载的 3.14.7 覆盖本机 DevCode 的 3.14.6，
# 而现有 _spatial 扩展的 ABI 验证基线是 3.14.6。
python-preference = "only-system"

[tool.uv.workspace]
members = ["backend"]

# ------------------------------------------------------------
# Ruff
# ------------------------------------------------------------
# 检查范围：backend/ 与 scripts/。
#
# 范围不写在本文件里——ruff 没有「检查哪些目录」的配置项，范围由调用方给出：
#   uv run ruff check backend/ scripts/  &&  uv run ruff format --check backend/ scripts/
# 调用点有两处，改动时须同步：scripts/bootstrap.ps1、scripts/bootstrap.sh。
#
# frontend/ 不在此列（TypeScript，另有工具链）；data/、notebooks/ 不做 lint。
[tool.ruff]
line-length = 100
src = ["backend/src", "scripts"]

# 排除 docs/ 的理由不是「文档不需要检查」，而是**检查对象不对**：
# Ruff 0.16 起 `ruff format` 会一并格式化 Markdown 内的 Python 代码块，而
# 文档里的代码块是**摘录与示例**——常为突出某个写法而刻意保留排布，不受源
# 文件格式规范的约束。不排除时，`ruff format --check .` 会因为文档里一处
# 注释前的空格数不同而判失败，那不是缺陷。
#
# 有了这条排除，「全仓库调用」（`ruff check .` / `ruff format --check .`）与
# 「声明范围调用」（`backend/ scripts/`）结果一致，调用点不必各自记得把范围
# 写全。范围仍以本注释上方声明的为准。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

# 两条忽略都不是「放行缺陷」，各有明确理由：
#
# * E501（行过长）——由 formatter 的 line-length 承担，再报一遍是重复。
# * RUF001/002/003（字符串 / 文档串 / 注释里的「歧义 Unicode 字符」）——检的是
#   全角标点（： ， （ ） 。）与全角字母。本仓库注释与文档串以中文书写，中文
#   行文里全角标点才是正确写法；这三条规则在中文代码库上是固有误报。实测
#   253 项报告里 246 项属此类，逐处 noqa 只会污染代码而不产生任何修复价值。
#
# 禁止用 `# noqa: RUF002` 逐处压制：那等于把全仓库的中文标点问题拆成 N 个
# 局部例外，规则一旦调整就无人能判断哪些例外还有效。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------
# mypy
# ------------------------------------------------------------
[tool.mypy]
strict = true
files = ["backend/src"]
show_error_codes = true
warn_unused_ignores = true

# 测试模块放宽「函数签名必须完整标注」一条，**只此一条**。
#
# 理由：测试的签名不承担对外契约，用例的价值在断言；为每个夹具参数补标注只增加
# 噪声，不产生可发现的缺陷。而用例函数体仍受 `check_untyped_defs`（strict 的组成
# 部分，未被此处覆盖）检查，故真实类型错误照样浮出——T3.6 期间 mypy 正是靠
# `disallow_any_generics` 与 `arg-type` 抓出测试自身两处 `NDArray` 缺参数、两处
# 夹具返回值缺 tuple 参数、以及 `Settings(**原始 dict)` 的类型不兼容。
#
# 禁止把本覆盖扩大为 `ignore_errors` 或对 `backend/src/rschange/**` 生效：那会让
# G3.2（ruff + mypy 零错误）退化为「对产品代码零错误」，而测试恰恰是产品代码的
# 主要调用方，其类型错误最有诊断价值。
[[tool.mypy.overrides]]
module = ["rschange.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ------------------------------------------------------------
# pytest
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/src/rschange/tests", "tests"]
pythonpath = ["backend/src"]
addopts = "-q --strict-markers"
markers = [
    "baseline: 基线锚点断言（§7.1/7.2/7.3），漂移即回归缺陷",
    "slow: 需要真实影像或完整流水线的用例",
]

# ------------------------------------------------------------
# coverage
# ------------------------------------------------------------
[tool.coverage.run]
source = ["backend/src/rschange"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
