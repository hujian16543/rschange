# ============================================================
# rschange 跨平台默认配置（入库）
#
# 禁止在本文件写入任何机器相关绝对路径。
# 本机专属值写在 config/local.toml（已被 git 忽略）。
# 优先级：环境变量 RSCHANGE_<SECTION>__<KEY>  >  local.toml  >  default.toml
# ============================================================

[runtime]
host = "127.0.0.1"
port = 8000
# 上传与输出根目录，相对仓库根解析
data_dir = "./data"
max_upload_mb = 500
# CORS 白名单。禁止使用 "*" 与 allow_credentials 组合（浏览器规范禁止，等于白名单失效）
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[engine]
# 原生依赖（GDAL 及 MinGW 运行时）DLL 目录。
# Windows 必填；Linux/macOS 留空，改由 LD_LIBRARY_PATH / DYLD_LIBRARY_PATH 提供。
runtime_dll_dir = ""
# _spatial 扩展所在目录。必须与 CMake 预设的输出目录一致，即
# engine/build/<预设名>（预设名见 engine/CMakePresets.json）。
# 本机取值写在 config/local.toml。
build_dir = "./engine/build/dev-win"

[logging]
level = "INFO"
format = "console"

[postprocess]
# 掩膜后处理（形态学）。
# min_size：连通块像素数**不超过**该值即被剔除（判定为严格大于）。
#   调大 -> 更激进地去除碎斑，但也可能误删真实的小面积变化。
min_size = 30
# structure_size：闭运算结构元边长（像素）。1 表示不做闭运算。
structure_size = 3

[baseline]
# 黄金基线 fixture（before/after 影像）
fixtures_dir = "./engine/tests/fixtures"
# 仅 Phase 1 使用：指向旧仓库的构建产物与 fixture 位置。
# Phase 2 完成引擎搬迁后，这两项必须清空，改由 engine.build_dir / baseline.fixtures_dir 提供。
legacy_build_dir = ""
legacy_fixtures_dir = ""
