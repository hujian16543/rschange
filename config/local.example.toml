# ============================================================
# rschange 本机配置模板（入库）
#
# 用法
# ----
# scripts/bootstrap.ps1 / bootstrap.sh 的第 6 步会把本文件复制为
# config/local.toml（目标已存在则不覆盖）。该目标文件已被 git 忽略，可安全
# 写入本机真实路径。
#
# 注意：本模板的键**全部处于注释状态**。照抄本文件得到的是一份「全部回落到
# config/default.toml」的空配置，其中 engine.runtime_dll_dir 为空。
#
# Windows 必读
# ------------
# engine.runtime_dll_dir 在 Windows 上是**必填项**：_spatial 扩展依赖 GDAL 与
# MinGW 运行时（libgdal-*.dll、libstdc++-6.dll 等），PE 加载器不会自动去
# MSYS2 的 bin 目录里找。留空即 import _spatial 报「找不到指定模块」。
# Linux / macOS 留空，改由 LD_LIBRARY_PATH / DYLD_LIBRARY_PATH 提供。
#
# 全部键均为可选：留空或删除即回落到 config/default.toml。
# 路径可以是绝对路径，也可以相对仓库根（写成 ./ 开头）。
#
# 环境变量覆盖格式：RSCHANGE_<段名大写>__<键名大写>
#   例：RSCHANGE_ENGINE__BUILD_DIR=./engine/build/dev-win
# ============================================================

[runtime]
# host = "127.0.0.1"
# port = 8000
# data_dir = "./data"
# max_upload_mb = 500
# allowed_origins = ["http://localhost:5173"]

[engine]
# ------------------------------------------------------------
# runtime_dll_dir：原生依赖（GDAL 等）运行时 DLL 所在目录
#
# **Windows 必填。** 留空则 import _spatial 失败，原因见文件头。
#
# Windows + MSYS2 示例：
#   runtime_dll_dir = "C:/Users/<用户名>/DevCode/msys64/mingw64/bin"
#
# Linux / macOS：
#   留空。改用 shell 环境变量提供：
#     export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
# ------------------------------------------------------------
# runtime_dll_dir = ""

# ------------------------------------------------------------
# build_dir：_spatial 扩展（.pyd/.so）所在目录
#
# 必须与 CMake 预设的输出目录一致。基预设 base 的 binaryDir 是
# ${sourceDir}/build/${presetName}，因此：
#   dev-win / release-win（入库预设） -> ./engine/build/dev-win
#   dev-linux / release-linux         -> ./engine/build/dev-linux
#   local-win（本机预设，不入库）      -> ./engine/build/dev-win
#
# 下面给出的默认值适用于本机预设与 Windows CI；Linux CI 的构建产物落在
# ./engine/build/dev-linux，须相应修改。预设定义见 engine/CMakePresets.json。
#
# 写错的典型症状：import _spatial 失败，或读到上一阶段的陈旧扩展。
# ------------------------------------------------------------
# build_dir = "./engine/build/dev-win"

[logging]
# level = "INFO"        # DEBUG / INFO / WARNING / ERROR
# format = "console"    # console | json

[postprocess]
# ------------------------------------------------------------
# 掩膜后处理的形态学参数。默认值 30 / 3 即 Phase 2 基线所用值。
#
# min_size：连通块像素数不超过该值的块会被剔除。
#   注意判定是「严格大于」：min_size = 30 表示保留 31 像素及以上的块。
#   调大会误删真实的小面积变化；调小会保留碎斑。
#
# structure_size：闭运算结构元边长（像素），1 表示不做闭运算。
#
# 环境变量形式：RSCHANGE_POSTPROCESS__MIN_SIZE=50
# ------------------------------------------------------------
# min_size = 30
# structure_size = 3

[baseline]
# fixtures_dir：黄金基线 fixture（before.tif / after.tif、变更掩膜）所在目录
# fixtures_dir = "./engine/tests/fixtures"

# ------------------------------------------------------------
# 以下两项仅 Phase 1 使用，Phase 2 起必须保持为空。
#
# 作用：让基线校验工具在引擎尚未搬迁时，仍能对旧构建产物做校验，从而证明
#      「校验工具本身的判定逻辑正确」。Phase 2 已完成引擎搬迁，故清空。
# config/default.toml 中这两项已声明为空字符串；本模板不再给出示例值——
#      给出示例值会让人误以为仍可填写。
# ------------------------------------------------------------
# legacy_build_dir = ""
# legacy_fixtures_dir = ""
