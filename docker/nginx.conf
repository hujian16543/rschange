# ============================================================================
# 前端 nginx：静态资源 + /api 反向代理
#
# 本文件负责修复 A5 缺陷
# ----------------------
# nginx 的请求体上限默认为 1 MB，而后端 runtime.max_upload_mb 默认为 500。
# 不设 client_max_body_size 时，任何 >1 MB 的 GeoTIFF 都在 nginx 层被拒，
# 返回 413 且**根本到不了后端**——后端的上限配置再正确也不生效，容器部署下
# 大文件上传的可用性因此为零。
#
# 两处数值必须一致：本文件的 client_max_body_size 与 config/default.toml 的
# runtime.max_upload_mb。一致性由 scripts/verify_containers.py 做机器判定，
# 不依赖人工比对。
# ============================================================================
server {
    listen 80;
    server_name _;

    # 与后端 runtime.max_upload_mb = 500 对齐。改此处须同步 config/default.toml。
    client_max_body_size 500m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的静态资源可长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 禁止缓存：否则发版后客户端仍按旧引用加载旧资源。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 回退：前端路由由客户端接管，未知路径一律交给 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 转发到后端。
    #
    # proxy_pass 不带尾斜杠，故保留完整 URI（含 /api 前缀），与后端
    # API_PREFIX = "/api" 一致。写成带尾斜杠会剥掉 /api，所有路由 404。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 检测是整幅影像的 CPU 密集运算，默认 60s 上限可能不足。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 不把整个请求体缓冲到临时文件：上传可达数百 MB。
        proxy_request_buffering off;
    }
}
