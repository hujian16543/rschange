# ============================================================================
# 双平台 CI
#
# 为什么是「双平台」而不是「Linux 加个 Windows 兜底」
# ------------------------------------------------
# 本项目的 C++ 引擎在两个平台上走的是**两套完全不同的工具链**：Windows 是
# MSYS2 的 mingw-w64 g++（配 python.org 的 MSVC 版 CPython），Linux 是系统
# GCC（配系统 CPython）。两套工具链的 ABI、DLL/SO 加载方式、GDAL 包版本都不同，
# 只跑一个平台无法发现另一侧的问题——历史上「本机好好的、换平台就崩」正是
# 这类差异造成的。故两个平台都是**必过项**，无主次之分。
#
# MSYS2 路径转换（防复发，勿删）
# ----------------------------
# MSYS2 shell 会把形如 `/c/...` 或 `-Dxxx=/path` 的参数自动改写为 Windows
# 路径，导致 CMake 收到被破坏的 `-D` 参数（症状是缓存变量值变成 `C:/Program
# Files/Git/path` 之类）。规避方式有两种：设 `MSYS2_ARG_CONV_EXCL="*"` 禁用
# 全部转换，或**根本不在 MSYS2 shell 里跑 CMake**。
#
# 本文件采用后者：CMake 用 runner 预装的 Windows 原生版本，只在 PATH 里加入
# MSYS2 的 mingw64/bin 以取得 Ninja、MinGW 编译器与运行期 DLL。这样不进入
# MSYS2 shell，路径转换问题从根上不存在，也就不依赖那个环境变量的记忆。
# 若将来改回在 MSYS2 shell 内执行 CMake，必须在脚本里显式设
# `MSYS2_ARG_CONV_EXCL="*"`。
#
# 三段门禁的定位
# --------------
# 1. C++ 单测（CTest）与 Python 测试（pytest）——功能正确性
# 2. 契约门禁（tests/contract + gen_openapi.py --check）——契约未漂移
# 3. scripts/verify_*.py——环境、配置、绑定、版本、容器资产的自洽性
# 三者任一失败即红。Phase 5 的 G5.2 正是靠第 2 段抓住「改了后端字段却没重新
# 生成前端类型」这类改动。
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行在新推送后即取消：CI 的价值在最新提交的结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 减少无关噪声输出；不改变任何构建语义。
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_LINK_MODE: "copy"

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不取消另一个：需要同时看到两侧的完整结果才能判断是
      # 平台特有问题还是共性问题。
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            preset: dev-linux
          - name: windows-mingw
            os: windows-latest
            preset: dev-win

    steps:
      - uses: actions/checkout@v4

      # 版本必须与 .python-version 精确一致：_spatial 扩展的 ABI 基线是
      # 3.14.6，次版本漂移会让基线断言失真而非报错。verify_containers.py
      # 也把「CI 版本 == .python-version」作为一条判据。
      - name: 安装 Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          check-latest: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # ---------------------------------------------------------------- Linux
      - name: 安装 GDAL 与 Ninja（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev ninja-build

      # -------------------------------------------------------------- Windows
      # 只装编译所需的 MinGW 组件，不装 MSYS2 自带的 CPython：后者一旦进入
      # PATH，uv 的 Python 解析可能落到那份「空环境」上（本机历史上出现过
      # 同类问题，见 config/local.example.toml 关于 conda 的说明）。
      - name: 安装 MinGW 工具链与 GDAL（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gdal
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf

      - name: 把 MSYS2 加入 PATH（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------- 环境变量注入
      # 引擎定位与运行期依赖全部经 RSCHANGE_* 环境变量给出，不生成
      # config/local.toml：配置优先级规定环境变量高于文件，CI 因此不必伪造
      # 一份「本机配置」，也不会与开发者本机文件产生差异。
      - name: 注入引擎与运行期环境变量
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            venv_python="$GITHUB_WORKSPACE/.venv/Scripts/python.exe"
            msys_root="C:/msys64/mingw64"
            echo "SPATIAL_MINGW_ROOT=$msys_root" >> "$GITHUB_ENV"
            echo "SPATIAL_GDAL_ROOT=$msys_root" >> "$GITHUB_ENV"
            echo "RSCHANGE_ENGINE__RUNTIME_DLL_DIR=$msys_root/bin" >> "$GITHUB_ENV"
          else
            venv_python="$GITHUB_WORKSPACE/.venv/bin/python"
          fi
          # CMake 的 Python_EXECUTABLE 与 uv 的解释器必须同一个，否则
          # find_package(Python) 会解析到系统 Python，扩展装进系统
          # site-packages 而运行期导入不到。
          echo "SPATIAL_PYTHON=$venv_python" >> "$GITHUB_ENV"
          echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "RSCHANGE_ENGINE__BUILD_DIR=./engine/build/${{ matrix.preset }}" >> "$GITHUB_ENV"

      - name: 安装 Python 依赖
        run: uv sync --all-packages --frozen

      # FetchContent 在构建期从 GitHub 拉 nlohmann/json 与 Catch2。缓存 _deps
      # 既省时间，也降低对上游网络可用性的依赖（未关闭项 O2）。
      - name: 缓存 FetchContent 依赖
        uses: actions/cache@v4
        with:
          path: engine/build/${{ matrix.preset }}/_deps
          key: fetchcontent-${{ matrix.preset }}-${{ hashFiles('engine/CMakeLists.txt') }}

      - name: 配置 C++ 编译器缓存
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.preset }}

      - name: 配置引擎
        working-directory: engine
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 构建引擎
        run: cmake --build --preset ${{ matrix.preset }}

      - name: C++ 单元测试
        run: ctest --test-dir engine/build/${{ matrix.preset }} --output-on-failure

      # -o addopts="" 覆盖项目 addopts 里的 -q：否则汇总行被压掉，CI 日志里
      # 看不到「多少通过、多少跳过」。
      - name: Python 测试
        run: uv run pytest -o addopts="" -rs

      - name: 类型检查
        run: uv run mypy

      - name: 代码检查与格式
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 契约漂移检测
        run: uv run python scripts/gen_openapi.py --check

      - name: 仓库自检脚本
        run: |
          uv run python scripts/verify_baseline.py --phase 6
          uv run python scripts/verify_bindings.py
          uv run python scripts/verify_config.py
          uv run python scripts/verify_version.py
          uv run python scripts/verify_containers.py

      # ------------------------------------------------------------ 前端
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 与 frontend/package.json 的 @types/node 主版本、docker/Dockerfile.frontend
          # 的 node 镜像保持一致（verify_containers.py 断言这三处同号）。
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端检查
        working-directory: frontend
        run: npm run check

      - name: 前端构建
        working-directory: frontend
        run: npm run build
