# ============================================================
# rschange · 遥感变化检测后端（uv 工作区成员包）
#
# 依赖声明原则：
#   - 只写「直接依赖」且不写死补丁版本；精确版本由根 uv.lock 锁定
#   - 需要但可选的重型依赖进 [project.optional-dependencies]
#     （例如 rasterio：仅在重新生成测试影像时需要，且 cp314 wheel 可用性不确定；
#       正式流程改用 GDAL 直接写盘，不依赖 rasterio）
#   - 禁止 readme 指向项目目录之外的文件（hatchling 会拒绝构建）
# ============================================================

[project]
name = "rschange"
# 版本号的唯一真相源。rschange.__version__ 从发行版元数据读取本值；
# frontend/package.json 与工作区根 pyproject.toml 由 scripts/verify_version.py
# 守护为同号。改版本只改这一处。
version = "1.0.1"
description = "遥感变化检测平台后端：FastAPI + C++ 空间引擎（_spatial）"
requires-python = ">=3.14,<3.15"
authors = [{ name = "胡建" }]
# 私有包：显式标记不得上传，避免误执行 `uv publish` 把内部代码推到 PyPI。
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    # --- C++ 引擎编译期（CMake 通过 python -m nanobind --cmake_dir 定位）---
    "nanobind>=2.4",
    # --- Web 层 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    # --- 数值与空间 ---
    "numpy>=2.1",
    "scipy>=1.14",
    "pyproj>=3.7",
    "pillow>=11.0",
]

[project.optional-dependencies]
# 仅在需要重新生成合成测试影像时安装：
#   uv sync --all-packages --extra fixtures
fixtures = ["rasterio>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rschange"]
# 测试不进 wheel：它们不是运行时代码。sdist（见下）仍包含 tests，
# 因此从源码检出后可直接跑 pytest，而安装后的包不带测试。
exclude = ["src/rschange/tests"]

[tool.hatch.build.targets.sdist]
include = ["src/rschange", "pyproject.toml"]
